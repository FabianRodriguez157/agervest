// ---------- Portfolio simulator (sandbox only — no real money moves here) ----------
let simProjects = [];
const simAllocations = {}; // projectId -> amount

async function loadSimulator() {
  const body = document.getElementById('simBody');
  try {
    simProjects = await API.get('/api/projects?status=active');
    if (!simProjects.length) {
      body.innerHTML = '<div class="empty-state">No hay proyectos activos disponibles para simular ahora mismo.</div>';
      return;
    }
    simProjects.forEach(p => { if (!(p.id in simAllocations)) simAllocations[p.id] = 0; });
    renderSimulator();
  } catch (e) {
    body.innerHTML = '<div class="empty-state">No se pudieron cargar los proyectos para el simulador.</div>';
  }
}

function remainingNeed(p) { return Math.max(0, p.investmentNeeded - p.amountRaised); }

function renderSimulator() {
  const body = document.getElementById('simBody');
  const budget = Number(document.getElementById('simBudget')?.value) || 0;

  const rows = simProjects.map(p => {
    const cap = remainingNeed(p);
    const amount = Math.min(simAllocations[p.id] || 0, cap);
    simAllocations[p.id] = amount;
    return `
    <div class="sim-project-row">
      <div>
        <div class="title">${p.title}</div>
        <div class="meta"><i data-lucide="wheat" class="icon-inline"></i> ${p.crop} · <i data-lucide="map-pin" class="icon-inline"></i> ${p.location} · <span class="chip risk-${p.computedRisk}" style="position:static;display:inline-block;padding:2px 8px;">${riskLabel(p.computedRisk)} · ${p.riskScorePct}%${p.riskConsistent ? '' : ' <i data-lucide="alert-triangle" class="icon-inline"></i>'}</span></div>
      </div>
      <div class="meta">Retorno<br><b style="color:var(--agv-green);font-size:14px;">+${p.expectedReturnPct}%</b></div>
      <div class="meta">Disponible<br><b>${fmtMoney(cap)}</b></div>
      <div>
        <input type="range" min="0" max="${Math.max(cap, 1)}" step="50" value="${amount}" oninput="updateAllocation('${p.id}', this.value, true)">
      </div>
      <div>
        <input type="number" min="0" max="${cap}" step="50" value="${amount}" style="width:100px;" oninput="updateAllocation('${p.id}', this.value, false)">
      </div>
    </div>`;
  }).join('');

  const totalAllocated = Object.values(simAllocations).reduce((s, v) => s + Number(v || 0), 0);
  const over = totalAllocated > budget;
  const usedPct = budget > 0 ? Math.min(100, (totalAllocated / budget) * 100) : 0;

  const totalExpected = simProjects.reduce((s, p) => s + (simAllocations[p.id] || 0) * (1 + p.expectedReturnPct / 100), 0);
  const byRisk = { bajo: 0, medio: 0, alto: 0 };
  simProjects.forEach(p => { byRisk[p.computedRisk] = (byRisk[p.computedRisk] || 0) + (simAllocations[p.id] || 0); });
  const cropsUsed = new Set(simProjects.filter(p => (simAllocations[p.id] || 0) > 0).map(p => p.crop)).size;

  body.innerHTML = `
    <div class="sim-budget-bar"><div class="seg ${over ? 'over' : 'used'}" style="width:${usedPct}%;"></div></div>
    <div class="sim-summary-row">
      <div class="box"><div class="l">Asignado / Presupuesto</div><div class="v" style="${over ? 'color:var(--agv-danger);' : ''}">${fmtMoney(totalAllocated)} / ${fmtMoney(budget)}</div></div>
      <div class="box"><div class="l">Retorno esperado total</div><div class="v" style="color:var(--agv-green);">${fmtMoney(totalExpected)}</div></div>
      <div class="box"><div class="l">Ganancia proyectada</div><div class="v gold">${fmtMoney(totalExpected - totalAllocated)}</div></div>
      <div class="box"><div class="l">Cultivos diversificados</div><div class="v">${cropsUsed}</div></div>
    </div>
    <div class="sim-risk-breakdown">
      <span class="pill bajo">Bajo: ${totalAllocated ? Math.round(byRisk.bajo / totalAllocated * 100) : 0}%</span>
      <span class="pill medio">Medio: ${totalAllocated ? Math.round(byRisk.medio / totalAllocated * 100) : 0}%</span>
      <span class="pill alto">Alto: ${totalAllocated ? Math.round(byRisk.alto / totalAllocated * 100) : 0}%</span>
    </div>
    ${over ? '<p style="color:var(--agv-danger);font-size:13px;font-weight:600;"><i data-lucide="alert-triangle" class="icon-inline"></i> La distribución supera tu presupuesto de prueba. Ajusta los montos antes de aplicar.</p>' : ''}
    <div>${rows}</div>
    <div class="sim-actions">
      <button class="btn btn-primary" onclick="applySimulation()" ${over || totalAllocated <= 0 ? 'disabled' : ''}><i data-lucide="check-circle-2" class="icon-inline"></i> Convertir esta simulación en inversiones reales</button>
      <div class="form-msg" id="simMsg"></div>
    </div>
    <p class="sim-disclaimer">El simulador no descuenta tu saldo real ni crea inversiones hasta que presiones "Convertir en inversiones reales". El riesgo mostrado es el riesgo contrastado por AgerVest (ver <i data-lucide="alert-triangle" class="icon-inline"></i> si difiere del declarado por el agricultor).</p>
  `;
}

function updateAllocation(projectId, value, fromSlider) {
  const p = simProjects.find(x => x.id === projectId);
  const cap = p ? remainingNeed(p) : Infinity;
  let v = Math.max(0, Math.min(Number(value) || 0, cap));
  simAllocations[projectId] = v;
  renderSimulator();
}

function resetAllocations() {
  simProjects.forEach(p => { simAllocations[p.id] = 0; });
  renderSimulator();
}

// ========================================================================
//  Motor de recomendación de portafolio (asistente IA de AgerVest)
// ------------------------------------------------------------------------
//  Combina 5 señales por proyecto y genera una explicación por asignación.
//  Factores: riesgo contrastado, confianza, score del productor,
//  retorno anualizado y bonificación por diversificación de cultivos.
//  Pesos ajustados por perfil de riesgo declarado del inversor.
// ========================================================================

const AI_PROFILE_WEIGHTS = {
  conservador: { risk: 0.40, confidence: 0.25, producer: 0.15, return: 0.10, diversify: 0.10 },
  moderado:    { risk: 0.25, confidence: 0.20, producer: 0.15, return: 0.30, diversify: 0.10 },
  agresivo:    { risk: 0.10, confidence: 0.10, producer: 0.10, return: 0.60, diversify: 0.10 },
};
const AI_RISK_ACCEPTANCE = {
  conservador: { bajo: 1.0, medio: 0.25, alto: 0.0 },
  moderado:    { bajo: 1.0, medio: 1.0,  alto: 0.35 },
  agresivo:    { bajo: 0.7, medio: 1.0,  alto: 1.0 },
};

function aiProjectScore(p, profile, cropsUsedSet) {
  const w = AI_PROFILE_WEIGHTS[profile];
  const acc = AI_RISK_ACCEPTANCE[profile][p.computedRisk] ?? 0;
  if (acc === 0) return { score: 0, reasons: [`Riesgo ${p.computedRisk} descartado por perfil ${profile}`] };

  const riskSignal = (100 - (p.riskScorePct || 50)) / 100;         // menor riesgo → mejor
  const confSignal = (p.confidenceIndex || 50) / 100;
  const prodSignal = (p.producerScore || 50) / 100;
  const annualizedReturn = Math.pow(1 + (p.expectedReturnPct || 0) / 100, 12 / (p.durationMonths || 12)) - 1;
  const retSignal = Math.min(1, annualizedReturn / 0.25);          // tope: 25% anual equivale a 1.0
  const diversifyBonus = cropsUsedSet.has(p.crop) ? 0 : 1;          // premia cultivos nuevos

  const score = acc * (
    w.risk * riskSignal +
    w.confidence * confSignal +
    w.producer * prodSignal +
    w.return * retSignal +
    w.diversify * diversifyBonus
  );

  const reasons = [];
  if (riskSignal > 0.7) reasons.push(`riesgo bajo (${p.riskScorePct}%)`);
  else if (riskSignal < 0.4) reasons.push(`riesgo elevado (${p.riskScorePct}%)`);
  if (confSignal > 0.75) reasons.push(`alta confianza (${p.confidenceIndex}/100)`);
  if (retSignal > 0.7) reasons.push(`retorno anualizado ${(annualizedReturn * 100).toFixed(1)}%`);
  if (diversifyBonus) reasons.push(`diversifica tu portafolio con ${p.crop}`);

  return { score, reasons, annualizedReturn };
}

async function autoAllocate() {
  const btn = event?.target?.closest('button');
  const budget = Number(document.getElementById('simBudget').value) || 0;
  const profile = document.getElementById('simProfile').value;

  if (!budget) {
    const msg = document.getElementById('simMsg');
    msg.className = 'form-msg err';
    msg.textContent = 'Define primero tu presupuesto de prueba.';
    return;
  }

  // UX: animación de "pensando"
  if (btn) { btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="icon-inline" style="animation:dspin 1s linear infinite;"></i> Analizando…'; }
  if (window.lucide) window.lucide.createIcons();

  resetAllocations();

  // Scoring multi-factor
  const cropsUsed = new Set();
  const scored = [];
  for (const p of simProjects) {
    if (remainingNeed(p) <= 0) continue;
    const { score, reasons, annualizedReturn } = aiProjectScore(p, profile, cropsUsed);
    if (score > 0) scored.push({ p, score, reasons, annualizedReturn });
  }
  scored.sort((a, b) => b.score - a.score);

  // Reparte por score, respetando capacidad restante y diversificación suave
  let remaining = budget;
  const rationale = [];
  for (const item of scored) {
    if (remaining <= 10) break;
    const cap = remainingNeed(item.p);
    const maxShareOfBudget = profile === 'agresivo' ? 0.40 : profile === 'moderado' ? 0.33 : 0.25;
    const maxFromBudget = Math.round((budget * maxShareOfBudget) / 10) * 10;
    const give = Math.min(remaining, cap, maxFromBudget);
    if (give < 50) continue;
    const rounded = Math.floor(give / 10) * 10;
    simAllocations[item.p.id] = rounded;
    cropsUsed.add(item.p.crop);
    remaining -= rounded;
    rationale.push({
      title: item.p.title,
      amount: rounded,
      pct: Math.round((rounded / budget) * 100),
      score: Math.round(item.score * 100),
      reasons: item.reasons,
      annualized: item.annualizedReturn,
    });
    if (rationale.length >= 4) break;    // concentra en top 4
  }

  // Si sobró, reparte entre asignados existentes
  if (remaining > 50 && rationale.length) {
    for (const r of rationale) {
      const p = simProjects.find(x => x.title === r.title);
      const cap = remainingNeed(p) - simAllocations[p.id];
      const add = Math.min(remaining, cap, Math.floor(remaining / rationale.length / 10) * 10);
      if (add >= 10) { simAllocations[p.id] += add; remaining -= add; r.amount += add; }
    }
  }

  // Animación breve
  await new Promise(r => setTimeout(r, 800));

  renderSimulator();
  renderAiRationale(profile, rationale, budget, remaining);

  if (btn) { btn.disabled = false; btn.innerHTML = '<i data-lucide="sparkles" class="icon-inline"></i> Regenerar sugerencia'; }
  if (window.lucide) window.lucide.createIcons();
}

function renderAiRationale(profile, rationale, budget, remaining) {
  const container = document.getElementById('aiRationale');
  if (!container) return;
  if (!rationale.length) {
    container.innerHTML = '<div class="empty-state" style="padding:14px;">No encontré proyectos que encajen con tu perfil <strong>'+profile+'</strong> en este momento.</div>';
    return;
  }
  const totalAlloc = rationale.reduce((s, r) => s + r.amount, 0);
  container.innerHTML = `
    <div class="ai-card">
      <div class="ai-head">
        <span class="ai-badge"><i data-lucide="sparkles" class="icon-inline"></i> Asistente AgerVest</span>
        <span style="color:var(--agv-muted);font-size:12.5px;">Perfil ${profile} · ${fmtMoney(totalAlloc)} de ${fmtMoney(budget)} asignado${remaining > 50 ? ` · ${fmtMoney(remaining)} sin asignar` : ''}</span>
      </div>
      <p class="ai-summary">Analicé ${simProjects.length} proyecto(s) activos combinando riesgo contrastado, confianza, score del productor, retorno anualizado y diversificación. Esta distribución maximiza el retorno esperado respetando tu tolerancia al riesgo.</p>
      <div class="ai-items">
        ${rationale.map(r => `
          <div class="ai-item">
            <div class="ai-item-head">
              <div class="ai-item-title">${r.title}</div>
              <div class="ai-item-amount">${fmtMoney(r.amount)} <span style="color:var(--agv-muted);font-size:12px;">(${r.pct}%)</span></div>
            </div>
            <div class="ai-reasons">${r.reasons.map(x => `<span class="ai-chip">${x}</span>`).join('')}</div>
            <div class="ai-meta">Score IA ${r.score}/100 · Retorno anualizado ${(r.annualized * 100).toFixed(1)}%</div>
          </div>
        `).join('')}
      </div>
      <p class="ai-foot">Esta sugerencia es informativa. Puedes ajustar cada asignación con los controles y luego convertirla en inversiones reales.</p>
    </div>
  `;
  if (window.lucide) window.lucide.createIcons();
}

async function applySimulation() {
  const msg = document.getElementById('simMsg');
  const toApply = simProjects.filter(p => (simAllocations[p.id] || 0) > 0);
  if (!toApply.length) return;
  const total = toApply.reduce((s, p) => s + simAllocations[p.id], 0);

  // Pre-vuelo: estado real del inversor
  msg.className = 'form-msg';
  msg.textContent = 'Verificando estado de la cuenta…';
  let me;
  try { me = await API.get('/api/auth/me'); }
  catch (e) { msg.className = 'form-msg err'; msg.textContent = 'No se pudo obtener tu cuenta: ' + e.message; return; }

  if (!me.user.verified) {
    msg.className = 'form-msg err';
    msg.innerHTML = '<strong>Tu cuenta no está verificada.</strong> Solicita la verificación desde el banner superior antes de invertir. '
      + (me.user.verificationRequestedAt ? '(Solicitud ya enviada, en revisión por el administrador.)' : '');
    return;
  }

  const balance = Number(me.user.walletBalance || 0);
  if (balance < total) {
    const shortfall = total - balance;
    openSimDepositModal(toApply, total, balance, shortfall);
    return;
  }

  if (!confirm(`Se crearán ${toApply.length} inversión(es) reales por ${fmtMoney(total)}, descontadas de tu saldo. ¿Continuar?`)) return;
  await executeSimApply(toApply);
}

async function executeSimApply(toApply) {
  const msg = document.getElementById('simMsg');
  msg.className = 'form-msg';
  let ok = 0; const failed = [];
  window.__simBatchKey = window.__simBatchKey || newIdempotencyKey();
  const simBatchKey = window.__simBatchKey;
  for (let i = 0; i < toApply.length; i++) {
    const p = toApply[i];
    msg.textContent = `Procesando inversión ${i + 1} de ${toApply.length}: ${p.title}…`;
    try {
      await API.post('/api/investments', { projectId: p.id, amount: simAllocations[p.id], idempotencyKey: simBatchKey + '-' + p.id });
      ok++;
    } catch (e) { failed.push(p.title + ': ' + (e.message || e)); }
  }
  if (failed.length) {
    msg.className = 'form-msg err';
    msg.innerHTML = `${ok} de ${toApply.length} aplicadas. Fallaron:<br>• ${failed.join('<br>• ')}`;
  } else {
    msg.className = 'form-msg ok';
    msg.textContent = `¡${ok} aporte(s) reservados! Se desembolsan solo cuando cada campaña completa su meta (comisión 6% únicamente en ese momento); si no, se reembolsan íntegros.`;
    window.__simBatchKey = null;
  }
  resetAllocations();
  setTimeout(load, 1800);
}

function openSimDepositModal(toApply, total, balance, shortfall) {
  const m = document.getElementById('depositModal');
  if (!m) return;
  m.classList.add('open');
  const body = m.querySelector('.modal-content');
  body.innerHTML = `
    <h3><i data-lucide="credit-card" class="icon-inline"></i> Saldo insuficiente</h3>
    <p style="color:var(--agv-muted);font-size:13.5px;margin:0 0 8px;">
      Simulación: tu portafolio simulado requiere <strong>${fmtMoney(total)}</strong>. Tu saldo actual es <strong>${fmtMoney(balance)}</strong>.
      Te faltan <strong style="color:var(--agv-green);">${fmtMoney(shortfall)}</strong>. Depositemos desde tu cuenta bancaria y aplicamos la simulación.
    </p>
    <form onsubmit="submitSimDeposit(event, ${shortfall})">
      <div class="field" style="margin-bottom:12px;">
        <label>Cuenta bancaria de origen</label>
        <input type="text" id="simDepBank" placeholder="Ej. 191-0012345-0-01" required>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>Monto a depositar (S/)</label>
        <input type="number" id="simDepAmount" min="10" step="10" value="${shortfall}" required>
      </div>
      <div class="form-msg err" id="simDepMsg"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px;">
        <button type="button" class="btn btn-outline" onclick="closeDepositModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Depositar y aplicar</button>
      </div>
    </form>
  `;
  if (window.lucide) window.lucide.createIcons();
  window.__simToApply = toApply;
}

async function submitSimDeposit(e, suggested) {
  e.preventDefault();
  const bank = document.getElementById('simDepBank').value.trim();
  const amount = Number(document.getElementById('simDepAmount').value);
  const msg = document.getElementById('simDepMsg');
  if (bank.length < 5) { msg.textContent = 'Cuenta bancaria inválida'; return; }
  if (!amount || amount < suggested) { msg.textContent = `Deposita al menos ${fmtMoney(suggested)}`; return; }

  const body = document.querySelector('#depositModal .modal-content');
  body.innerHTML = `
    <h3><i data-lucide="credit-card" class="icon-inline"></i> Procesando transferencia</h3>
    <div class="deposit-spinner"><div class="spinner"></div><div>Debitando ${fmtMoney(amount)} de ${bank}…</div></div>
  `;
  if (window.lucide) window.lucide.createIcons();
  await new Promise(r => setTimeout(r, 1500));

  try {
    await API.post('/api/wallet/deposit', { amount, bankAccount: bank });
    body.innerHTML = `
      <h3><i data-lucide="check-circle-2" class="icon-inline"></i> Depósito confirmado</h3>
      <p style="color:var(--agv-muted);">Aplicando ${window.__simToApply.length} inversión(es)…</p>
      <div class="deposit-spinner"><div class="spinner"></div></div>
    `;
    if (window.lucide) window.lucide.createIcons();
    closeDepositModal();
    await executeSimApply(window.__simToApply);
  } catch (err) {
    body.innerHTML = `
      <h3><i data-lucide="alert-triangle" class="icon-inline"></i> Error</h3>
      <p class="form-msg err">${err.message || err}</p>
      <div style="text-align:right;margin-top:10px;"><button class="btn btn-primary" onclick="closeDepositModal()">Cerrar</button></div>
    `;
    if (window.lucide) window.lucide.createIcons();
  }
}

document.addEventListener('input', (e) => { if (e.target.id === 'simBudget') renderSimulator(); });

function initInvestorAnalytics(){
  if(!window.AgerVestAnalytics) return;
  const tabs=document.getElementById('investorCropTabs');
  AgerVestAnalytics.cropTabs('Papa','investorCropTabs');
  const render=(crop)=>AgerVestAnalytics.renderCropPanel('investorCropAnalytics',crop,false,'investor');
  tabs?.querySelectorAll('[data-av-crop]').forEach(b=>b.addEventListener('click',()=>{tabs.querySelectorAll('.crop-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.avCrop);}));
  render('Papa');
  AgerVestAnalytics.renderRiskAndCosts('investorRegionalAnalytics','investor-reg');
}

load();
setTimeout(initInvestorAnalytics, 40);

// --- Depósito simulado ---
function openDepositModal() {
  const m = document.getElementById('depositModal');
  if (!m) return;
  m.classList.add('open');
  document.getElementById('depositForm').style.display = '';
  document.getElementById('depositSpinner').style.display = 'none';
  document.getElementById('depositSuccess').style.display = 'none';
  document.getElementById('depositMsg').textContent = '';
}
function closeDepositModal() { document.getElementById('depositModal')?.classList.remove('open'); }

async function submitDeposit(e) {
  e.preventDefault();
  const amount = Number(document.getElementById('depAmount').value);
  const bank = document.getElementById('depBank').value.trim();
  const msg = document.getElementById('depositMsg');
  msg.textContent = '';
  if (!amount || amount <= 0) { msg.textContent = 'Monto inválido'; return; }
  if (bank.length < 5) { msg.textContent = 'Cuenta bancaria inválida'; return; }

  document.getElementById('depositForm').style.display = 'none';
  document.getElementById('depositSpinner').style.display = '';

  // Simula latencia de pasarela
  await new Promise(r => setTimeout(r, 1600));

  try {
    const r = await API.post('/api/wallet/deposit', { amount, bankAccount: bank });
    document.getElementById('depositSpinner').style.display = 'none';
    const ok = document.getElementById('depositSuccess');
    ok.style.display = '';
    ok.innerHTML = `<div style="text-align:center;padding:10px 0;">
      <i data-lucide="check-circle-2" style="width:48px;height:48px;color:var(--agv-green);"></i>
      <h3 style="margin:12px 0 6px;">Depósito confirmado</h3>
      <p style="color:var(--agv-muted);font-size:14px;">Se abonaron <strong>${fmtMoney(amount)}</strong> a tu billetera.<br>Saldo nuevo: <strong>${fmtMoney(r.newBalance)}</strong></p>
      <button class="btn btn-primary" style="margin-top:14px;" onclick="closeDepositModal();load();">Entendido</button>
    </div>`;
    if (window.lucide) window.lucide.createIcons();
  } catch (err) {
    document.getElementById('depositSpinner').style.display = 'none';
    document.getElementById('depositForm').style.display = '';
    msg.textContent = 'Error: ' + (err.message || err);
  }
}
</script>
</body>
