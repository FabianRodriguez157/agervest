<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Panel de aliado — AgerVest</title><link rel="stylesheet" href="css/styles.css"></head>
<body><nav class="topbar" id="navbar"></nav><section class="section"><div class="container" id="content"><div class="loading">Cargando panel…</div></div></section><footer id="footer"></footer>
<script src="js/config.js"></script>
<script src="js/common.js"></script><script src="js/agervest-v3-data.js"></script><script src="js/agervest-analytics.js"></script><script>
renderNavbar('ally-dash');
async function load(){const c=document.getElementById('content');try{const me=await API.get('/api/auth/me');if(me.role!=='ally'){location.href=me.role==='farmer'?'farmer-dashboard.html':me.role==='investor'?'investor-dashboard.html':'login.html';return}Session.setAlly(me.user.id,me.user.name);const d=await API.get('/api/allies/'+me.user.id+'/dashboard');const rows=d.queue.map((x,i)=>{const p=x.project,f=x.farmer;return `<tr><td>${f?.name||'—'}</td><td>${p.title}</td><td>${x.risk.riskScorePct}%</td><td><span class="status-pill ${p.status}">${statusLabel(p.status)}</span></td><td>${f?.validated?'✅ Validado':'⏳ Pendiente'}</td></tr>`}).join('');c.innerHTML=`<div class="dash-header"><div class="who"><div class="avatar">🤝</div><div><h1>${d.ally.name}</h1><div class="sub">${d.ally.organization||'Aliado / asociación'} · ${d.ally.email}</div></div></div><a href="catalog.html" class="btn btn-primary">Ver oportunidades</a></div><div class="kpi-row"><div class="card kpi-card"><div class="l">Productores acompañados</div><div class="v">${d.producersSupported}</div></div><div class="card kpi-card"><div class="l">Campañas en revisión</div><div class="v">${d.campaignsUnderReview}</div></div><div class="card kpi-card"><div class="l">Campañas publicadas</div><div class="v">${d.publishedCampaigns}</div></div><div class="card kpi-card"><div class="l">Estado de cuenta</div><div class="v">${d.ally.verified?'Verificada':'Activa'}</div></div></div><div class="dashboard-notice"><span class="notice-icon">ℹ️</span><div><strong>Rol aliado:</strong> este perfil sirve para acompañar productores y revisar información de campañas dentro del prototipo; no otorga facultades para invertir ni modificar cuentas ajenas.</div></div><div class="card table-card"><h3>Cola de validación y seguimiento</h3><table><thead><tr><th>Productor</th><th>Campaña</th><th>Riesgo calculado</th><th>Estado</th><th>Productor</th></tr></thead><tbody>${rows}</tbody></table></div><div style="margin-top:22px" id="allyDataOverview"></div><div class="card" style="padding:20px;margin-top:22px;"><div class="crop-tabs" id="allyCropTabs"></div><div id="allyCropAnalytics"></div></div><div style="margin-top:22px" id="allyAnalytics"></div>`;AgerVestAnalytics.renderOverview('allyDataOverview');
AgerVestAnalytics.cropTabs('Papa','allyCropTabs');
const at=document.getElementById('allyCropTabs'); const ar=c=>AgerVestAnalytics.renderCropPanel('allyCropAnalytics',c,true,'ally'); at?.querySelectorAll('[data-av-crop]').forEach(b=>b.addEventListener('click',()=>{at.querySelectorAll('.crop-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');ar(b.dataset.avCrop);})); ar('Papa');
AgerVestAnalytics.renderRiskAndCosts('allyAnalytics','ally')}catch(e){c.innerHTML='<div class="empty-state">No se pudo cargar el panel. <a href="login.html">Volver al inicio de sesión</a></div>'}}
load();</script></body></html>
