services:
  postgres:
    image: postgres:16-alpine
    container_name: agervest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agervest
      POSTGRES_PASSWORD: agervest
      POSTGRES_DB: agervest
    ports:
      - "5432:5432"
    volumes:
      - agervest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agervest -d agervest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agervest_pgdata:
